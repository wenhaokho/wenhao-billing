  - engine: postgresql
    schema: migrations
    queries: internal/hosting/queries.sql
    gen:
      go:
        package: hostingdb
        out: internal/hosting/hostingdb
        sql_package: pgx/v5
        emit_enum_valid_method: true
        emit_pointers_for_null_types: true
        overrides: *go_overrides
  - engine: postgresql
    schema: migrations
    queries: internal/stats/queries.sql
    gen:
      go:
        package: statsdb
        out: internal/stats/statsdb
        sql_package: pgx/v5
        emit_enum_valid_method: true
        emit_pointers_for_null_types: true
        # go_overrides plus billing_cycle_ref passed through as stored (see
        # the invoices entry).
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: pg_catalog.numeric
            nullable: true
