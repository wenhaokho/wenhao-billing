          - db_type: timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamp
            go_type: time.Time
          - db_type: pg_catalog.timestamp
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - column: invoices.billing_cycle_ref
            go_type: encoding/json.RawMessage
