# The read comparison corpus (plan 11, Task 3).
#
# `compare reads` replays every case here against both backends with GET
# requests only, and diffs each pair under port/allowed-diffs.yaml. The one
# non-GET the runner ever makes is Python's POST /auth/login, and only when a
# password is given (`--python-cookie-stdin` sends no POST at all). The Go
# token is sent as the billing_session cookie; the runner never POSTs to Go.
#
# Case fields:
#   id        names the case in the report. A known difference (PN 6, two
#             identical open invoices) is classified by this id, never hidden
#             by an entry in allowed-diffs.yaml.
#   route     "GET /path"; every {name} is filled from an earlier case's
#             discover, or from {today} (the run's UTC date).
#   queries   the query variants to send; "" is the bare route. A parameter may
#             repeat (status=OPEN&status=SENT) and may hold {name}.
#   discover  the id field a list response yields (name == field, or
#             {name, field} when the placeholder differs, as the recurring
#             templates list returns invoices).
#   classify  the PORT-NOTES note a difference under this case belongs to.
#
# Reads only, per inventory §2: every frontend GET, the frontend's query
# variants, the GETs the frontend never calls (/invoices/recurring-templates,
# /accounting/fx-rates/latest, /payments/{id}), and the two discovery
# documents. Path ids come from the list responses (the first, last and a
# middle element), never from a hard-coded path. /mcp is JSON-RPC over POST,
# so it is not here; its own tests and Task 9's owner check cover it.
#
# The balance sheet runs with as_of = today (decision 3), so PN 97 does not
# arise, and the dashboard needs no special case: PN 97/98 have no allowance
# on purpose.

cases:
  # --- auth and users -----------------------------------------------------
  - id: auth-me
    route: GET /api/v1/auth/me
  - id: users
    route: GET /api/v1/users

  # --- chart of accounts and FX ------------------------------------------
  - id: chart-of-accounts
    route: GET /api/v1/accounting/chart-of-accounts
    discover:
      - account_id
  - id: account-detail
    route: GET /api/v1/accounting/chart-of-accounts/{account_id}
  - id: base-currency
    route: GET /api/v1/accounting/base-currency
  - id: fx-rates
    route: GET /api/v1/accounting/fx-rates
  # The frontend never calls this one.
  - id: fx-rates-latest
    route: GET /api/v1/accounting/fx-rates/latest

  # --- reports (as_of = today, the balance sheet included) ---------------
  - id: report-trial-balance
    route: GET /api/v1/accounting/reports/trial-balance
    queries:
      - "as_of={today}"
  - id: report-balance-sheet
    route: GET /api/v1/accounting/reports/balance-sheet
    queries:
      - "as_of={today}"
  - id: report-fx-revaluation
    route: GET /api/v1/accounting/reports/fx-revaluation
    queries:
      - "as_of={today}"
  - id: report-ar-aging
    route: GET /api/v1/accounting/reports/ar-aging
    queries:
      - "as_of={today}"
  - id: report-ap-aging
    route: GET /api/v1/accounting/reports/ap-aging
    queries:
      - "as_of={today}"

  # --- business profile ---------------------------------------------------
  - id: business-profile
    route: GET /api/v1/business-profile
  - id: business-payment-accounts
    route: GET /api/v1/business-profile/payment-accounts

  # --- customers ----------------------------------------------------------
  - id: customers
    route: GET /api/v1/customers
    queries:
      - ""
      - "active=true"
    discover:
      - customer_id
  - id: customers-balances
    route: GET /api/v1/customers/balances
  - id: customer-detail
    route: GET /api/v1/customers/{customer_id}
  - id: customer-billing-summary
    route: GET /api/v1/customers/{customer_id}/billing-summary
  - id: customer-invoices
    route: GET /api/v1/customers/{customer_id}/invoices

  # --- vendors ------------------------------------------------------------
  - id: vendors
    route: GET /api/v1/vendors
    queries:
      - ""
      - "active=true"
    discover:
      - vendor_id
  - id: vendor-detail
    route: GET /api/v1/vendors/{vendor_id}

  # --- items --------------------------------------------------------------
  - id: items
    route: GET /api/v1/items
    discover:
      - item_id
  - id: item-detail
    route: GET /api/v1/items/{item_id}

  # --- projects -----------------------------------------------------------
  - id: projects
    route: GET /api/v1/projects
    queries:
      - ""
      - "status=ACTIVE"
      - "customer_id={customer_id}&status=ACTIVE"
    discover:
      - project_id
  - id: project-detail
    route: GET /api/v1/projects/{project_id}
  - id: project-summary
    route: GET /api/v1/projects/{project_id}/summary
  - id: project-invoices
    route: GET /api/v1/projects/{project_id}/invoices

  # --- invoices -----------------------------------------------------------
  - id: invoices
    route: GET /api/v1/invoices
    queries:
      - ""
      - "status=DRAFT"
      - "status=OPEN&status=SENT&status=PARTIAL"
    discover:
      - invoice_id
  - id: invoices-awaiting-finalization
    route: GET /api/v1/invoices/awaiting-finalization
  - id: invoice-detail
    route: GET /api/v1/invoices/{invoice_id}
  - id: invoice-payments
    route: GET /api/v1/invoices/{invoice_id}/payments
  # window.open, binary: the diff compares status and two headers only.
  - id: invoice-pdf
    route: GET /api/v1/invoices/{invoice_id}/pdf
  # The frontend never calls the bare templates list; the list returns
  # invoices, so the placeholder template_id is filled from invoice_id.
  - id: recurring-templates
    route: GET /api/v1/invoices/recurring-templates
    discover:
      - name: template_id
        field: invoice_id
  - id: recurring-template-rows
    route: GET /api/v1/invoices/recurring-templates/rows
  - id: recurring-template-detail
    route: GET /api/v1/invoices/recurring-templates/{template_id}

  # --- quotations ---------------------------------------------------------
  - id: quotations
    route: GET /api/v1/quotations
    queries:
      - ""
      - "status=DRAFT&status=SENT"
      - "status=ACCEPTED&status=INVOICED"
    discover:
      - quotation_id
  - id: quotation-detail
    route: GET /api/v1/quotations/{quotation_id}
  - id: quotation-pdf
    route: GET /api/v1/quotations/{quotation_id}/pdf

  # --- bills --------------------------------------------------------------
  - id: bills
    route: GET /api/v1/bills
    queries:
      - ""
      - "status=DRAFT&status=OPEN"
    discover:
      - bill_id
  - id: bill-detail
    route: GET /api/v1/bills/{bill_id}

  # --- payments, reconciliation and stats ---------------------------------
  - id: payments-audit-log
    route: GET /api/v1/payments/audit-log
  - id: payments-awaiting-review
    route: GET /api/v1/payments/awaiting-review
    discover:
      - payment_id
  # The frontend never calls this one.
  - id: payment-detail
    route: GET /api/v1/payments/{payment_id}
  - id: payment-log
    route: GET /api/v1/payments/{payment_id}/log
  - id: stats-dashboard
    route: GET /api/v1/stats/dashboard
  - id: stats-revenue-monthly
    route: GET /api/v1/stats/revenue-monthly
  - id: stats-invoices-summary
    route: GET /api/v1/stats/invoices-summary

  # --- OAuth and discovery ------------------------------------------------
  # Both print the same issuer and endpoints when MCP_PUBLIC_BASE_URL is the
  # same. /mcp itself is JSON-RPC over POST and stays out of this corpus.
  - id: oauth-authorization-server
    route: GET /.well-known/oauth-authorization-server
  - id: oauth-protected-resource
    route: GET /.well-known/oauth-protected-resource
