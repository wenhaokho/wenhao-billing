# The write comparison scenarios (plan 11, Task 4).
#
# `compare writes --python URL --python-db DSN --go URL --go-db DSN ...` runs
# these ordered flows against both backends, then compares the rows the run
# touched and every step's answers.
#
# Both databases MUST be restored from ONE dump just before the run. The runner
# snapshots every listed table first and then compares only the rows the run
# created, changed or deleted: a pre-existing row is paired by its primary key,
# which is only the same row on both sides when both came from the same dump.
# The scenarios create rows with fixed codes and numbers (account codes 9900
# and 9901, project codes CMP and CMP-DEL, quotation Q-CMP-1, bills B-CMP-1 to
# B-CMP-4, webhook external_ref compare-webhook), so restore both databases again before
# a second run.
#
# Both databases must be local: the runner refuses a database or a backend URL
# whose host is not localhost, 127.0.0.1, ::1, or a compose service name.
#
# Both backends must run with RESEND_API_KEY and CLOUDFLARE_API_TOKEN unset.
# The runner can check only its OWN environment: it refuses to run when that
# has RESEND_API_KEY, but it cannot see the backends' environments, so starting
# them without the keys is the operator's job. (trigger-template also notifies
# admins of the new draft, which mails when RESEND_API_KEY is set.) Every send
# route is excluded: /auth/forgot-password, /invoices/{id}/send,
# /quotations/{id}/send and /invoices/{id}/payments/{pid}/send-receipt.
# fx-rates/sync is excluded too. No PAID transition is requested on an invoice
# with hosting lines: that would call the Cloudflare restore.
#
# A step's `extract` maps a placeholder name to a JSONPath in the response.
# The JSONPath's last key names the table (customer_id is customers, and so
# on). Each name is extracted once; a later step never overwrites it. The
# Python id and the Go id are stored separately and every later step uses each
# backend's own id. A DELETE deletes or deactivates the row it names, so the
# rows a scenario deletes are scratch rows created for that purpose; no later
# step uses them.
#
# A scenario's `classify` names the PORT-NOTES note a difference under it
# belongs to. It never hides a difference: PN 6 (two identical open invoices)
# is classified by scenario id, not by an allowance.
#
# Row differences are also classified one by one (compare/classify.go). A
# rule names a PORT-NOTES note; it never hides the difference:
#   - a journal entry Go posts and Python never does, by source_type: INVOICE
#     PN 162, BILL PN 164, BILL_PAYMENT PN 165, and PAYMENT PN 161 for a
#     manual payment (both payments MANUAL, the bank line its amount). Each
#     entry must pass self-consistency checks first: two or more lines that
#     balance in base and in amount; one active entry per document (one
#     entry per payment); one control line on the right side (AR debit, AP
#     credit, AP debit, bank debit); an active issue entry matches its
#     document's amount and currency at the issue date's rate and the
#     document is not a DRAFT or a template; a reversal mirrors the entry it
#     reverses. An entry's lines take its verdict;
#   - a paired PAYMENT entry's lines are PN 163 when only the receivable's
#     base and rate differ, both sides balance in base, and the 4900/5900
#     lines' net base changed by exactly the receivable's base change;
#   - a bill voided by PATCH (Python only sets the status) is PN 164;
#   - a manual payment Go reversed (Python refuses, PN 161): the payment row
#     (FLAGGED on Go), the invoice row (balance restored) and Go's REVERSED
#     log row are PN 161.
# A difference that fails a check stays unclassified and names the check
# ("check" in the report). A step's `classify_answers: {note: "PN n", paths:
# ["$.key", ...]}` names the note for its answer differences at those paths
# only. Every classified difference is still counted and listed; the report
# prints "N differences, M unclassified" and the exit code is unchanged.
#
# A correct run of this file shows 0 unclassified: every deliberate
# difference the scenarios produce is described by a rule above. Any
# unclassified difference is a finding to investigate before the switch.
#
# Every step note (`note`, `classify_answers.note`) is exactly one "PN n".
#
# The webhook body is signed with the shared local WEBHOOK_HMAC_SECRET in the
# X-Signature header. The webhook pays an invoice of its own
# ({intake_invoice_id}); approve-intake applies the intake payment to it. The
# payment reversal runs last, on an invoice of its own
# (reverse-manual-payment), because Go and Python answer it differently.
#
# A step with `go_only: true` (and a `note: "PN n"`) is sent to Go alone, for
# one of two reasons only, each naming its PN: a route Python never had (a
# bill payment's list or reversal), or to resync a deliberate Go divergence
# so both backends hold the same rows again (bill-lifecycle's pay-part-again
# re-pays the payment Go alone reversed; bill-void-with-payment reverses and
# voids on Go what Python voided directly). Its Go answer must be 2xx and is
# not compared; its extracts are Go's alone, and no step sent to both
# backends may use them.
#
# A step may declare `expect_status: N` (both backends) or
# `expect_status: {python: N, go: N}`. The run continues past a non-2xx answer
# that matches it; a step whose expected statuses differ needs a `note: "PN n"`
# and its bodies are not compared. `expect_detail: "text"` also requires that
# text in the body of every non-2xx answer of the step. Extracts are not taken from a non-2xx side.
# A body value that is exactly one placeholder ("{account_id}") keeps the
# extracted value's JSON type; a placeholder inside a longer string is text.
#
# None of these steps has run against the real backends yet (plan 11 Task 4
# fix round 1): the first real run may still find a body field to adjust.

scenarios:
  # --- master data CRUD ---------------------------------------------------
  # The kept rows (account_id, customer_id, vendor_id, item_id, project_id)
  # are used by the later scenarios and are never deleted. Each delete runs
  # on a scratch row of its own.
  - id: master-data
    tables:
      - chart_of_accounts
      - customers
      - vendors
      - items
      - projects
      - business_profile
      - payment_account
      - fx_rates
    steps:
      - id: create-account
        method: POST
        path: /api/v1/accounting/chart-of-accounts
        body: {code: "9900", name: "Compare expense", type: "EXPENSE", active: true}
        extract: {account_id: "$.account_id"}
      - id: update-account
        method: PATCH
        path: /api/v1/accounting/chart-of-accounts/{account_id}
        body: {name: "Compare expense 2"}
      - id: create-scratch-account
        method: POST
        path: /api/v1/accounting/chart-of-accounts
        body: {code: "9901", name: "Compare scratch account", type: "ASSET", active: true}
        extract: {scratch_account_id: "$.account_id"}
      - id: deactivate-scratch-account
        method: DELETE
        path: /api/v1/accounting/chart-of-accounts/{scratch_account_id}

      - id: create-customer
        method: POST
        path: /api/v1/customers
        body: {name: "Compare customer", default_currency: "IDR", active: true}
        extract: {customer_id: "$.customer_id"}
      - id: update-customer
        method: PATCH
        path: /api/v1/customers/{customer_id}
        body: {name: "Compare customer 2"}
      - id: create-scratch-customer
        method: POST
        path: /api/v1/customers
        body: {name: "Compare scratch customer", default_currency: "IDR", active: true}
        extract: {scratch_customer_id: "$.customer_id"}
      - id: deactivate-scratch-customer
        method: DELETE
        path: /api/v1/customers/{scratch_customer_id}

      - id: create-vendor
        method: POST
        path: /api/v1/vendors
        body: {name: "Compare vendor", active: true}
        extract: {vendor_id: "$.vendor_id"}
      - id: update-vendor
        method: PATCH
        path: /api/v1/vendors/{vendor_id}
        body: {name: "Compare vendor 2"}
      - id: create-scratch-vendor
        method: POST
        path: /api/v1/vendors
        body: {name: "Compare scratch vendor", active: true}
        extract: {scratch_vendor_id: "$.vendor_id"}
      - id: deactivate-scratch-vendor
        method: DELETE
        path: /api/v1/vendors/{scratch_vendor_id}

      - id: create-item
        method: POST
        path: /api/v1/items
        body: {name: "Compare item", item_type: "SERVICE", default_currency: "IDR", active: true, is_sold: true, is_purchased: false}
        extract: {item_id: "$.item_id"}
      - id: update-item
        method: PATCH
        path: /api/v1/items/{item_id}
        body: {name: "Compare item 2"}
      - id: create-scratch-item
        method: POST
        path: /api/v1/items
        body: {name: "Compare scratch item", item_type: "SERVICE", default_currency: "IDR", active: true, is_sold: true, is_purchased: false}
        extract: {scratch_item_id: "$.item_id"}
      - id: deactivate-scratch-item
        method: DELETE
        path: /api/v1/items/{scratch_item_id}

      - id: create-project
        method: POST
        path: /api/v1/projects
        body: {customer_id: "{customer_id}", code: "CMP", name: "Compare project", currency: "IDR", status: "ACTIVE", contract_value: "1000.00"}
        extract: {project_id: "$.project_id"}
      - id: update-project
        method: PATCH
        path: /api/v1/projects/{project_id}
        body: {name: "Compare project 2"}
      - id: create-scratch-project
        method: POST
        path: /api/v1/projects
        body: {customer_id: "{customer_id}", code: "CMP-DEL", name: "Compare scratch project", currency: "IDR", status: "ACTIVE"}
        extract: {scratch_project_id: "$.project_id"}
      - id: delete-scratch-project
        method: DELETE
        path: /api/v1/projects/{scratch_project_id}

      - id: update-business-profile
        method: PUT
        path: /api/v1/business-profile
        body: {name: "Compare business", address: "Compare address"}
      - id: update-payment-accounts
        method: PUT
        path: /api/v1/business-profile/payment-accounts
        body:
          - {currency: "IDR", instructions: "Compare bank 0000000000", is_default: true}

      # 2001-01-01 keeps clear of the dump's own USD/IDR rates (one per date).
      - id: create-fx-rate
        method: POST
        path: /api/v1/accounting/fx-rates
        body: {from_currency: "USD", to_currency: "IDR", rate: "16000.0000", as_of_date: "2001-01-01", source: "COMPARE"}
        extract: {rate_id: "$.rate_id"}
      - id: delete-fx-rate
        method: DELETE
        path: /api/v1/accounting/fx-rates/{rate_id}

  # --- invoice lifecycle --------------------------------------------------
  # finalize-invoice posts the issue entry (Dr AR / Cr revenue) on Go only
  # (PN 162). record-payment posts a payment entry on Go only (PN 161; Python
  # posts no manual payment), relieving AR at the invoice's issue basis
  # (PN 163). The manual payment's reversal is in the last scenario of the
  # file, on an invoice of its own.
  - id: invoice-lifecycle
    tables:
      - invoices
      - invoice_line_items
      - payments
      - reconciliation_log
      - journal_entries
      - journal_lines
    steps:
      - id: create-invoice
        method: POST
        path: /api/v1/invoices
        body:
          customer_id: "{customer_id}"
          project_id: "{project_id}"
          invoice_type: "MILESTONE"
          currency: "IDR"
          issue_date: "2026-01-01"
          due_date: "2026-02-01"
          payment_terms: "Net 30"
          wht_type: "NONE"
          wht_rate: "0.0000"
          wht_gross_up: false
          line_items:
            - {item_id: "{item_id}", description: "Compare service", quantity: "1.0000", unit_price: "1000.0000", position: 1}
        extract: {invoice_id: "$.invoice_id"}
      - id: finalize-invoice
        method: POST
        path: /api/v1/invoices/{invoice_id}/finalize
      - id: record-payment
        method: POST
        path: /api/v1/invoices/{invoice_id}/record-payment
        body: {amount: "1000.0000", payment_date: "2026-01-02", payer_name: "Compare payer", payer_reference: "compare-payment", notes: "compare"}
        extract: {payment_id: "$.payment_id"}
      - id: list-payments
        method: GET
        path: /api/v1/invoices/{invoice_id}/payments

  # --- recurring template -------------------------------------------------
  - id: recurring-template
    tables:
      - invoices
      - invoice_line_items
    steps:
      - id: create-template
        method: POST
        path: /api/v1/invoices/recurring-template
        body:
          customer_id: "{customer_id}"
          project_id: "{project_id}"
          invoice_type: "RECURRING"
          currency: "IDR"
          issue_date: "2026-01-01"
          due_date: "2026-02-01"
          payment_terms: "Net 30"
          line_items:
            - {item_id: "{item_id}", description: "Compare recurring", quantity: "1.0000", unit_price: "1000.0000", position: 1}
          schedule: {frequency: "MONTHLY", interval: 1, start_date: "2026-01-01", end_mode: "AFTER_N", end_after_cycles: 1}
        extract: {template_id: "$.invoice_id"}
      - id: trigger-template
        method: POST
        path: /api/v1/invoices/recurring/{template_id}/trigger
        body: {cycle_key: "2026-01-01"}
        extract: {recurring_invoice_id: "$.invoice_id"}

  # --- quotation ----------------------------------------------------------
  - id: quotation
    tables:
      - quotations
      - quotation_line_items
      - invoices
      - invoice_line_items
    steps:
      - id: create-quotation
        method: POST
        path: /api/v1/quotations
        body:
          customer_id: "{customer_id}"
          project_id: "{project_id}"
          currency: "IDR"
          quotation_number: "Q-CMP-1"
          issue_date: "2026-01-01"
          valid_until: "2026-02-01"
          payment_terms: "Net 30"
          line_items:
            - {item_id: "{item_id}", description: "Compare quote", quantity: "1.0000", unit_price: "1000.0000", position: 1}
        extract: {quotation_id: "$.quotation_id"}
      - id: accept-quotation
        method: POST
        path: /api/v1/quotations/{quotation_id}/accept
        body: {accepted_by: null}
      - id: convert-quotation
        method: POST
        path: /api/v1/quotations/{quotation_id}/convert-to-invoice
        body: {}
        extract: {quote_invoice_id: "$.invoice_id"}

  # --- bill open and void -------------------------------------------------
  # The expense account is the kept, active account_id (code 9900).
  # expense_account_id is a numeric field: "{account_id}" is the whole value,
  # so the runner sends the extracted number as a JSON number on both backends
  # (typed placeholder substitution). item_id is not set on the bill line.
  #
  # B-CMP-1 is opened and voided with no payment: Go posts the open entry and
  # reverses it on void (both BILL, PN 164); the bill rows agree. Go refuses
  # to void a bill with payments (PN 165), so no payment is recorded here; the
  # payments are bill-lifecycle's.
  #
  # B-CMP-3 is voided by PATCH status VOID: Python only sets the status (the
  # balance stays due, no note); Go voids it (balance 0, a "[voided] status
  # set to VOID via update" line, the open entry reversed). The bills row is
  # classified PN 164, and so are the PATCH answers' balance_due and notes
  # (classify_answers).
  - id: bill
    tables:
      - bills
      - bill_line_items
      - journal_entries
      - journal_lines
    steps:
      - id: create-bill
        method: POST
        path: /api/v1/bills
        body:
          vendor_id: "{vendor_id}"
          project_id: "{project_id}"
          bill_number: "B-CMP-1"
          currency: "IDR"
          issue_date: "2026-01-01"
          due_date: "2026-02-01"
          payment_terms: "Net 30"
          line_items:
            - {expense_account_id: "{account_id}", description: "Compare bill", quantity: "1.0000", unit_price: "1000.0000", position: 1}
        extract: {bill_id: "$.bill_id"}
      - id: update-bill
        method: PATCH
        path: /api/v1/bills/{bill_id}
        body: {status: "OPEN"}
      - id: void-bill
        method: POST
        path: /api/v1/bills/{bill_id}/void
        body: {reason: "compare"}
      - id: create-patch-void-bill
        method: POST
        path: /api/v1/bills
        body:
          vendor_id: "{vendor_id}"
          project_id: "{project_id}"
          bill_number: "B-CMP-3"
          currency: "IDR"
          issue_date: "2026-01-01"
          due_date: "2026-02-01"
          payment_terms: "Net 30"
          line_items:
            - {expense_account_id: "{account_id}", description: "Compare bill voided by PATCH", quantity: "1.0000", unit_price: "1000.0000", position: 1}
        extract: {patch_void_bill_id: "$.bill_id"}
      - id: open-patch-void-bill
        method: PATCH
        path: /api/v1/bills/{patch_void_bill_id}
        body: {status: "OPEN"}
      - id: patch-void-bill
        method: PATCH
        path: /api/v1/bills/{patch_void_bill_id}
        body: {status: "VOID"}
        classify_answers: {note: "PN 164", paths: ["$.balance_due", "$.notes"]}

  # --- bill void refused with payments (PN 165) ------------------------------
  # B-CMP-4: open, pay part, void. Python voids it (200); Go refuses a void
  # while a payment stands (400). Go then reverses the payment and voids on
  # its own (go_only resync, PN 165), so both bill rows end VOID with nothing
  # due and the same "[voided] compare" line. Go's open, payment, payment
  # reversal and void entries are classified PN 164 / PN 165.
  - id: bill-void-with-payment
    tables:
      - bills
      - bill_line_items
      - journal_entries
      - journal_lines
    steps:
      - id: create-paid-void-bill
        method: POST
        path: /api/v1/bills
        body:
          vendor_id: "{vendor_id}"
          project_id: "{project_id}"
          bill_number: "B-CMP-4"
          currency: "IDR"
          issue_date: "2026-01-01"
          due_date: "2026-02-01"
          payment_terms: "Net 30"
          line_items:
            - {expense_account_id: "{account_id}", description: "Compare bill void with payment", quantity: "1.0000", unit_price: "1000.0000", position: 1}
        extract: {paid_void_bill_id: "$.bill_id"}
      - id: open-paid-void-bill
        method: PATCH
        path: /api/v1/bills/{paid_void_bill_id}
        body: {status: "OPEN"}
      - id: pay-paid-void-bill
        method: POST
        path: /api/v1/bills/{paid_void_bill_id}/record-payment
        body: {amount: "500.0000", payment_date: "2026-01-02", payer_reference: "compare-bill-4", notes: "compare"}
      - id: void-bill-with-payment
        method: POST
        path: /api/v1/bills/{paid_void_bill_id}/void
        body: {reason: "compare"}
        expect_status: {python: 200, go: 400}
        expect_detail: "cannot void a bill with payments"
        note: "PN 165"
      - id: list-paid-void-bill-payments
        method: GET
        path: /api/v1/bills/{paid_void_bill_id}/payments
        go_only: true
        note: "PN 165"
        extract: {paid_void_bill_payment_id: "$[0].bill_payment_id"}
      - id: reverse-paid-void-bill-payment
        method: POST
        path: /api/v1/bills/{paid_void_bill_id}/payments/{paid_void_bill_payment_id}/reverse
        body: {reason: "compare"}
        go_only: true
        note: "PN 165"
      - id: void-paid-void-bill-on-go
        method: POST
        path: /api/v1/bills/{paid_void_bill_id}/void
        body: {reason: "compare"}
        go_only: true
        note: "PN 165"

  # --- bill lifecycle (PN 164, PN 165) -------------------------------------
  # B-CMP-2: open, pay part, reverse that payment, pay the same part again,
  # pay the rest, and a void refused while PAID. Go posts the open entry
  # (BILL, PN 164) and each bill payment and its reversal (BILL_PAYMENT,
  # PN 165) and stores bill_payments rows (Go-only, not compared). Python has
  # no bill payment list or reversal route, so those steps are go_only; the
  # payment is recorded again on Go alone so that both backends hold the same
  # PARTIAL balance (600) before pay-rest, and the bill rows agree from there:
  # both end PAID with nothing due, and both refuse the void with the same
  # status and sentence.
  - id: bill-lifecycle
    tables:
      - bills
      - bill_line_items
      - journal_entries
      - journal_lines
    steps:
      - id: create-lifecycle-bill
        method: POST
        path: /api/v1/bills
        body:
          vendor_id: "{vendor_id}"
          project_id: "{project_id}"
          bill_number: "B-CMP-2"
          currency: "IDR"
          issue_date: "2026-01-01"
          due_date: "2026-02-01"
          payment_terms: "Net 30"
          line_items:
            - {expense_account_id: "{account_id}", description: "Compare bill lifecycle", quantity: "1.0000", unit_price: "1000.0000", position: 1}
        extract: {lc_bill_id: "$.bill_id"}
      - id: open-lifecycle-bill
        method: PATCH
        path: /api/v1/bills/{lc_bill_id}
        body: {status: "OPEN"}
      - id: pay-part
        method: POST
        path: /api/v1/bills/{lc_bill_id}/record-payment
        body: {amount: "400.0000", payment_date: "2026-01-02", payer_reference: "compare-bill-1", notes: "compare"}
      - id: list-bill-payments
        method: GET
        path: /api/v1/bills/{lc_bill_id}/payments
        go_only: true
        note: "PN 165"
        extract: {lc_bill_payment_id: "$[0].bill_payment_id"}
      - id: reverse-bill-payment
        method: POST
        path: /api/v1/bills/{lc_bill_id}/payments/{lc_bill_payment_id}/reverse
        body: {reason: "compare"}
        go_only: true
        note: "PN 165"
      - id: pay-part-again
        method: POST
        path: /api/v1/bills/{lc_bill_id}/record-payment
        body: {amount: "400.0000", payment_date: "2026-01-02", payer_reference: "compare-bill-1", notes: "compare"}
        go_only: true
        note: "PN 165"
      - id: pay-rest
        method: POST
        path: /api/v1/bills/{lc_bill_id}/record-payment
        body: {amount: "600.0000", payment_date: "2026-01-03", payer_reference: "compare-bill-2", notes: "compare"}
      - id: void-paid-bill
        method: POST
        path: /api/v1/bills/{lc_bill_id}/void
        body: {reason: "compare"}
        expect_status: 400
        expect_detail: "is PAID and cannot be voided"

  # --- webhook intake, approve and reverse --------------------------------
  # The intake payment goes to manual review (the payer name is not the
  # customer's, so the confidence stays under 95); approve-intake applies it to
  # {intake_invoice_id}, a fresh OPEN invoice of its own, so the normal "approve
  # a held payment against an OPEN invoice" path is what is compared. The
  # lifecycle invoice is already PAID by then and is not an auto-match
  # candidate. {intake_payment_id} never overwrites {payment_id}.
  - id: webhook-intake
    classify: PN 6
    tables:
      - payments
      - reconciliation_log
      - journal_entries
      - journal_lines
      - invoices
      - invoice_line_items
    steps:
      - id: create-intake-invoice
        method: POST
        path: /api/v1/invoices
        body:
          customer_id: "{customer_id}"
          project_id: "{project_id}"
          invoice_type: "MILESTONE"
          currency: "IDR"
          issue_date: "2026-01-01"
          due_date: "2026-02-01"
          payment_terms: "Net 30"
          wht_type: "NONE"
          wht_rate: "0.0000"
          wht_gross_up: false
          line_items:
            - {item_id: "{item_id}", description: "Compare intake service", quantity: "1.0000", unit_price: "1000.0000", position: 1}
        extract: {intake_invoice_id: "$.invoice_id"}
      - id: finalize-intake-invoice
        method: POST
        path: /api/v1/invoices/{intake_invoice_id}/finalize
      - id: intake-webhook
        method: POST
        path: /api/v1/payments/intake/webhook
        sign: true
        body:
          amount: "1000.0000"
          currency: "IDR"
          payer_name: "Compare payer"
          payer_reference: "compare-webhook"
          payment_date: "2026-01-02"
          external_ref: "compare-webhook"
        extract: {intake_payment_id: "$.payment_id"}
      - id: approve-intake
        method: POST
        path: /api/v1/payments/{intake_payment_id}/manual-review
        body: {invoice_id: "{intake_invoice_id}", adjustment_type: "NONE"}
      - id: reverse-intake
        method: POST
        path: /api/v1/payments/{intake_payment_id}/reverse
        body: {reason: "compare"}

  # --- reverse a manual payment (PN 161) ------------------------------------
  # Go posts manual payments to the ledger and can reverse them (200, the
  # payment becomes FLAGGED and the invoice balance is restored); Python
  # refuses with 400 no_active_entry. The payment row, the invoice row and
  # Go's REVERSED log row then differ; the PN 161 reversal rule classifies
  # them. The scenario has an invoice and payment
  # of its own, so the rows that differ under PN 161 are only this scenario's
  # (row differences are not attributed to a scenario in the report; `classify`
  # records which PORT-NOTES note the scenario is known for). It is the last
  # scenario so nothing after it depends on the two sides' diverged state.
  - id: reverse-manual-payment
    classify: PN 161
    tables:
      - invoices
      - invoice_line_items
      - payments
      - reconciliation_log
      - journal_entries
      - journal_lines
    steps:
      - id: create-rev-invoice
        method: POST
        path: /api/v1/invoices
        body:
          customer_id: "{customer_id}"
          project_id: "{project_id}"
          invoice_type: "MILESTONE"
          currency: "IDR"
          issue_date: "2026-01-01"
          due_date: "2026-02-01"
          payment_terms: "Net 30"
          wht_type: "NONE"
          wht_rate: "0.0000"
          wht_gross_up: false
          line_items:
            - {item_id: "{item_id}", description: "Compare reversal service", quantity: "1.0000", unit_price: "1000.0000", position: 1}
        extract: {rev_invoice_id: "$.invoice_id"}
      - id: finalize-rev-invoice
        method: POST
        path: /api/v1/invoices/{rev_invoice_id}/finalize
      - id: record-rev-payment
        method: POST
        path: /api/v1/invoices/{rev_invoice_id}/record-payment
        body: {amount: "1000.0000", payment_date: "2026-01-02", payer_name: "Compare payer", payer_reference: "compare-rev-payment", notes: "compare"}
        extract: {rev_payment_id: "$.payment_id"}
      - id: reverse-payment
        method: POST
        path: /api/v1/payments/{rev_payment_id}/reverse
        body: {reason: "compare"}
        expect_status: {python: 400, go: 200}
        expect_detail: "no active journal entry"
        note: "PN 161"
