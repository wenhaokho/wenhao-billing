# Allowed differences for the Go/Python comparison (plan 11, Task 2).
#
# Each entry names the PORT-NOTES note ("PN n") or spec line it stands for, so
# the comparison report can show why a difference is expected. The comparison
# reports every other difference, and no entry covers a whole route: `path`
# names the field, or `$.status` / `$.detail` for one error.
#
# Rules:
#   decimal-equal  two decimal strings are equal by value (PN 99; also global)
#   instant-equal  two timestamps are equal as instants (also global)
#   number-equal   two JSON numbers are equal by value (PN 104)
#   ignore         the field is not compared
#   unordered      the array compares as a multiset (PN 40/41/44/47/53/78/100)
#   status         the status code differs on purpose
#   detail-shape   the error detail (sentence or shape) differs on purpose
#
# Paths are JSONPaths; an array index is [*]. A bare `$` is a route whose body
# is a JSON array. Task 3's corpus and Task 6's runs may add a path where a
# response shape turns out to differ.

# --- Global rules, recorded for their notes -------------------------------

# PN 99: zero prints as `0` or `0.0000` and `-0.0000` equals `0.0000`.
- route: GET /api/v1/accounting/reports/trial-balance
  path: $.rows[*].debit
  rule: decimal-equal
  note: PN 99
- route: GET /api/v1/accounting/reports/trial-balance
  path: $.rows[*].credit
  rule: decimal-equal
  note: PN 99
- route: GET /api/v1/accounting/reports/balance-sheet
  path: $.groups[*].lines[*].base_balance
  rule: decimal-equal
  note: PN 99
- route: GET /api/v1/accounting/reports/fx-revaluation
  path: $.rows[*].difference
  rule: decimal-equal
  note: PN 99

# PN 50: `expected_cash` is `"0"` in Python and `"0.0000"` in Go.
- route: GET /api/v1/invoices/{invoice_id}
  path: $.expected_cash
  rule: decimal-equal
  note: PN 50
- route: GET /api/v1/invoices
  path: $[*].expected_cash
  rule: decimal-equal
  note: PN 50

