# Allowed differences for the Go/Python comparison (plan 11, Task 2).
#
# Each entry names the PORT-NOTES note ("PN n") or spec line it stands for, so
# the comparison report can show why a difference is expected. The comparison
# reports every other difference, and no entry covers a whole route.
#
# Rules:
#   decimal-equal  two decimal strings are equal by value (PN 99)
#   instant-equal  two timestamps are equal as instants (PN 76, 108)
#   number-equal   two JSON numbers are equal by value (PN 104)
#   ignore         the field is not compared
#   unordered      the array compares as a multiset (PN 40/41/44/47/53/78/100)
#   status         the HTTP status differs on purpose; the entry names the
#                  exact pair (python:, go:) at the path @status
#   detail-shape   the error detail differs on purpose; the entry names the Go
#                  status (go_code:) and/or a regexp on the Go detail
#                  (detail_pattern:)
#
# decimal-equal and instant-equal are GLOBAL value rules: decimals already
# compare by value and timestamps as instants whether or not an entry names
# them. Their per-entry uses below are documentation of the note, not a change
# to the comparison.
#
# Paths are JSONPaths whose array index is [*], or @status for the HTTP status.
# A bare-array route's entries use $[*] for its elements; `path: $` is refused
# for ignore/unordered/status/detail-shape, which would cover the whole route.
# A literal route is preferred over a {param} pattern, so a pattern entry never
# reaches a literal sibling such as /invoices/awaiting-finalization.
#
# The PN 6 tie (two identical open invoices) is NOT allowed here: it is
# classified by corpus case in Task 3 and Task 6, so a real mismatch is never
# hidden. Likewise PN 97 (balance-sheet as_of) and PN 98 (open-AR rule): the
# corpus runs the balance sheet with as_of = today and the dashboard with data
# that has no templates or non-positive balances, so neither arises. A note
# whose exact codes or sentence is not recorded is left out on purpose; the
# difference then surfaces in Task 6 to classify, which is the safe direction.

# --- Global rules, recorded for their notes -------------------------------

# PN 99: zero prints as `0` or `0.0000` and `-0.0000` equals `0.0000`.
- route: GET /api/v1/accounting/reports/trial-balance
  path: $.rows[*].debit
  rule: decimal-equal
  note: PN 99
- route: GET /api/v1/accounting/reports/trial-balance
