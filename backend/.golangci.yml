version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    # Every test and subtest runs in parallel (./dev test uses -parallel 8 on
    # the throwaway db-test Postgres). A test that must not, says why with
    # //nolint:paralleltest // <reason>.
    - paralleltest
    - tparallel
    - revive
    - rowserrcheck
    - sqlclosecheck
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use log/slog
        - pattern: ^float64$
          msg: money is decimal.Decimal, never float64
    exhaustive:
      default-signifies-exhaustive: false
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      # Tests decode JSON numbers into float64; app code never holds money in one.
      - path: _test\.go
        linters: [forbidigo]
        text: float64
      # The PDF layout measures the page in millimetres and points.
      - path: internal/pdf/layout\.go
        linters: [forbidigo]
        text: float64

formatters:
  enable:
    - gofumpt
    - goimports
