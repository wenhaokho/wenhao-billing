# Production deployment for Coolify — two containers on one domain:
#   wenhao-billing-web  nginx serving the built SPA; it is the only public service
#                       and proxies /api, /mcp, /oauth, /.well-known, /docs,
#                       /redoc and /openapi.json to the API, so the browser sees
#                       a single origin.
#   wenhao-billing-api  the Go API (backend/; no public domain of its own). It
#                       replaced the Python API (backend-python/, no longer
#                       deployed) on 2026-11-11, keeping the service name so
#                       nginx's upstream and depends_on are unchanged.
# Uses a SHARED Postgres (managed separately in Coolify); this stack only ships
# the app. Periodic jobs (recurring invoices, usage lock, hosting enforcement,
# FX sync) run on an in-process scheduler inside the API — there is no worker
# or Redis. It is off until GO_SCHEDULER_ENABLED=true (see
# docs/runbooks/go-cutover.md).
#
# At start-up the API adopts a database the Python backend built (Alembic at
# 0028_business_npwp, no goose history) and then applies its own migrations;
# on any schema drift it refuses to start and writes nothing (PORT-NOTES 170).
#
# In Coolify: New Resource -> Docker Compose (Build Pack), point it at this file.
# Coolify auto-fills the SERVICE_* "magic" variables: it provisions the public
# domain + Traefik route from SERVICE_FQDN_WEB_80 and generates every
# SERVICE_BASE64_* secret once, then persists them.
#
# Set DATABASE_URL to the shared Postgres connection string
# (Coolify UI, or .env for a run outside Coolify — see .env.coolify.example).
# The shared Postgres must be attached to the same Docker network as this
# resource so the API can reach it by hostname.

services:
  # Every variable has the value the Python service had, so sessions, MCP
  # tokens and the database line up. ENVIRONMENT is deliberately unset: Go
  # defaults to production, so the session cookie is Secure and a blank or
  # default intake secret is refused.
  wenhao-billing-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # The Go image: ENTRYPOINT /api (serve; adopts, then migrates).
    image: wenhao-billing-api:coolify-go
    environment:
      # Shared Postgres — full connection string you provide. The
      # postgresql+psycopg:// form Coolify holds is accepted: Go rewrites the
      # driver prefix for pgx.
      DATABASE_URL: ${DATABASE_URL}
      # Secrets — Coolify generates 64-char values once and persists them.
      SESSION_SECRET: ${SERVICE_BASE64_64_SESSION}
      WEBHOOK_HMAC_SECRET: ${SERVICE_BASE64_64_WEBHOOK}
      EMAIL_WEBHOOK_TOKEN: ${SERVICE_BASE64_64_EMAILTOKEN}
      # Single origin — the SPA is same-origin with the API (via the web
      # proxy), so this is really only needed for non-browser cross-origin callers.
      CORS_ORIGINS: '["${SERVICE_URL_WEB_80:-https://billing.wenhao.id}"]'
      APP_BASE_URL: ${SERVICE_URL_WEB_80:-https://billing.wenhao.id}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_CONFIRM_SECRET: ${SERVICE_BASE64_64_MCPCONFIRM}
      MCP_TOKEN_SECRET: ${SERVICE_BASE64_64_MCPTOKEN}
      MCP_PUBLIC_BASE_URL: ${SERVICE_URL_WEB_80:-https://billing.wenhao.id}
      MCP_ACCESS_TOKEN_TTL_SECONDS: ${MCP_ACCESS_TOKEN_TTL_SECONDS:-3600}
      MCP_REFRESH_TOKEN_TTL_SECONDS: ${MCP_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      # Resend email (native API). Set RESEND_API_KEY in the Coolify UI to enable;
      # when empty, outgoing mail is logged, not sent. The sender domain must
      # be verified in Resend.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@wenhao.id}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Wenhao Dev Billing}
      # Cloudflare DNS suspend/restore for hosting items. Set in the Coolify UI.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # Sentry error monitoring (backend). Off when SENTRY_DSN is empty.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      # The scheduled jobs stay off at the deploy; the owner turns them on
      # (GO_SCHEDULER_ENABLED=true in Coolify, then restart) after the ledger
      # back-post (docs/runbooks/go-cutover.md).
      SCHEDULER_ENABLED: ${GO_SCHEDULER_ENABLED:-false}
    healthcheck:
      # The image is distroless (no shell or curl): the binary probes itself.
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  wenhao-billing-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # Frontend Sentry config is inlined into the SPA bundle at build time.
      args:
        VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    image: wenhao-billing-web:coolify
    environment:
      # Presence of this key tells Coolify to generate the public FQDN for this
      # service on container port 80 and wire up the Traefik route + TLS.
      SERVICE_FQDN_WEB_80: ${SERVICE_FQDN_WEB_80:-billing.wenhao.id}
      # Where nginx proxies the API paths (compose service name + port). nginx
      # resolves it per request through Docker's DNS, so a recreated API
      # container's new address is picked up within 10 s.
      BACKEND_UPSTREAM: wenhao-billing-api:8000
    depends_on:
      wenhao-billing-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
