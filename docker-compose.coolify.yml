# Production deployment for Coolify — one domain and up to two API containers:
#   wenhao-billing-web     nginx serving the built SPA; it is the only public
#                          service and proxies /api, /mcp, /oauth, /.well-known
#                          and /docs to the API, so the browser sees a single
#                          origin.
#   wenhao-billing-api     the frozen FastAPI backend; it serves the site until
#                          the switch-over.
#   wenhao-billing-api-go  the Go backend, deployed side by side with Python
#                          during the compare week. It has no public domain of
#                          its own; nginx reaches it only after the switch sets
#                          BACKEND_UPSTREAM to it.
# The two APIs share one Postgres. Which one nginx talks to is the
# BACKEND_UPSTREAM variable, and which one runs the periodic jobs is
# PY_SCHEDULER_ENABLED / GO_SCHEDULER_ENABLED, so the switch and the way back
# are an environment change plus a redeploy, with no git change. Exactly one
# API runs the scheduler at a time: Python writes no scheduled_job_runs rows,
# so two live schedulers would run a slot twice.
# Periodic jobs (recurring invoices, hosting enforcement, FX sync) run on an
# in-process scheduler inside the API — there is no worker or Redis.
#
# In Coolify: New Resource -> Docker Compose (Build Pack), point it at this file.
# Coolify auto-fills the SERVICE_* "magic" variables: it provisions the public
# domain + Traefik route from SERVICE_FQDN_WEB_80 and generates every
# SERVICE_BASE64_* secret once, then persists them.
#
# Set DATABASE_URL to the shared Postgres connection string
# (Coolify UI, or .env for a run outside Coolify — see .env.coolify.example).
# The shared Postgres must be attached to the same Docker network as this
# resource so the API can reach it by hostname.

services:
  wenhao-billing-api:
    build:
      context: ./backend-python
      dockerfile: Dockerfile.prod
    image: wenhao-billing-api:coolify
    environment:
      # Shared Postgres — full connection string you provide. The DB URL MUST
      # use the postgresql+psycopg:// driver prefix (SQLAlchemy).
      DATABASE_URL: ${DATABASE_URL}
      # Secrets — Coolify generates 64-char values once and persists them.
      SESSION_SECRET: ${SERVICE_BASE64_64_SESSION}
      WEBHOOK_HMAC_SECRET: ${SERVICE_BASE64_64_WEBHOOK}
      EMAIL_WEBHOOK_TOKEN: ${SERVICE_BASE64_64_EMAILTOKEN}
      # Single origin — the SPA is same-origin with the API (via the web
      # proxy), so this is really only needed for non-browser cross-origin callers.
      CORS_ORIGINS: '["${SERVICE_URL_WEB_80:-https://billing.wenhao.id}"]'
      APP_BASE_URL: ${SERVICE_URL_WEB_80:-https://billing.wenhao.id}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_CONFIRM_SECRET: ${SERVICE_BASE64_64_MCPCONFIRM}
      MCP_TOKEN_SECRET: ${SERVICE_BASE64_64_MCPTOKEN}
      MCP_PUBLIC_BASE_URL: ${SERVICE_URL_WEB_80:-https://billing.wenhao.id}
      MCP_ACCESS_TOKEN_TTL_SECONDS: ${MCP_ACCESS_TOKEN_TTL_SECONDS:-3600}
      MCP_REFRESH_TOKEN_TTL_SECONDS: ${MCP_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      # Resend email (native API). Set RESEND_API_KEY in the Coolify UI to enable;
      # when empty, outgoing mail falls back to logging (no SMTP configured here).
      # Takes precedence over SMTP. The sender domain must be verified in Resend.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@wenhao.id}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Wenhao Dev Billing}
      # Cloudflare DNS suspend/restore for hosting items. Set in the Coolify UI.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # Sentry error monitoring (backend). Off when SENTRY_DSN is empty.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      # Python runs the periodic jobs until the switch-over (its own default).
      SCHEDULER_ENABLED: ${PY_SCHEDULER_ENABLED:-true}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Apply migrations, then serve (production uvicorn — no --reload).
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]

  # The Go backend, side by side with Python. It takes the Python service's
  # value for every variable the two share, so tokens, sessions and the
  # database line up; Go rewrites the postgresql+psycopg:// driver prefix for
  # pgx. ENVIRONMENT is deliberately unset: Go defaults to production, so the
  # session cookie is Secure and a blank or default intake secret is refused.
  # No SERVICE_FQDN_* — this service is reached only through nginx.
  wenhao-billing-api-go:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wenhao-billing-api-go:coolify
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SERVICE_BASE64_64_SESSION}
      WEBHOOK_HMAC_SECRET: ${SERVICE_BASE64_64_WEBHOOK}
      EMAIL_WEBHOOK_TOKEN: ${SERVICE_BASE64_64_EMAILTOKEN}
      CORS_ORIGINS: '["${SERVICE_URL_WEB_80:-https://billing.wenhao.id}"]'
      APP_BASE_URL: ${SERVICE_URL_WEB_80:-https://billing.wenhao.id}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_CONFIRM_SECRET: ${SERVICE_BASE64_64_MCPCONFIRM}
      MCP_TOKEN_SECRET: ${SERVICE_BASE64_64_MCPTOKEN}
      MCP_PUBLIC_BASE_URL: ${SERVICE_URL_WEB_80:-https://billing.wenhao.id}
      MCP_ACCESS_TOKEN_TTL_SECONDS: ${MCP_ACCESS_TOKEN_TTL_SECONDS:-3600}
      MCP_REFRESH_TOKEN_TTL_SECONDS: ${MCP_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@wenhao.id}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Wenhao Dev Billing}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      # Go's scheduler stays off until the switch, and Python's stays on.
      SCHEDULER_ENABLED: ${GO_SCHEDULER_ENABLED:-false}
    healthcheck:
      # The image is distroless (no shell or curl): the binary probes itself.
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    # The image's ENTRYPOINT is /api with no arguments, which serves and then
    # runs goose. Do NOT deploy Go before `api adopt-baseline` has run against
    # this database (Task 8.1); serve refuses an un-adopted Alembic database.

  wenhao-billing-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # Frontend Sentry config is inlined into the SPA bundle at build time.
      args:
        VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    image: wenhao-billing-web:coolify
    environment:
      # Presence of this key tells Coolify to generate the public FQDN for this
      # service on container port 80 and wire up the Traefik route + TLS.
      SERVICE_FQDN_WEB_80: ${SERVICE_FQDN_WEB_80:-billing.wenhao.id}
      # Where nginx proxies the API paths (compose service name + port). The
      # switch flips this between the two API services. It is written into the
      # nginx config at start-up, so a switch is always a redeploy; nginx
      # resolves the host per request (Docker DNS), so it starts and serves
      # even while the other API container is down.
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-wenhao-billing-api:8000}
    depends_on:
      # Start after the API that is certain to run. This stays on Python only
      # until Python is removed (Task 10): Go may legitimately be unhealthy or
      # stopped while the compare runs, and nginx must keep serving.
      wenhao-billing-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
