# Overlay for the local switch rehearsal (plan 11, Task 5 step 2). Combine it
# with the Coolify compose, which expects a shared Postgres it does not ship:
#
#   docker compose -f docker-compose.coolify.yml \
#     -f scripts/rehearse-switch.compose.yml --env-file <rehearsal.env> up -d
#
# scripts/rehearse-switch.sh builds that env file and drives the whole run; this
# file only supplies what a single machine needs beside the Coolify stack:
#
#   * shared-postgres — the hostname the example env's DATABASE_URL uses. It is
#     the restored dev database the rehearsal runs against.
#   * provider-stub — stands in for Frankfurter (GET /latest) and the Cloudflare
#     DNS API (PATCH /zones/<zone>/dns_records/<record>), and logs one line per
#     request, so the rehearsal can count the Cloudflare calls each scheduler
#     makes. Both APIs are pointed at it below; nothing reaches the internet.
#   * a published port for wenhao-billing-web — the Coolify service has no
#     published port (Coolify points Traefik at it), so locally nginx needs one
#     to be reachable. curl treats http://localhost as a secure context, so the
#     Secure session cookie is sent over it.
#
# It adds no project of its own: the caller sets COMPOSE_PROJECT_NAME. Nothing
# here is used in production.
services:
  shared-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    # Over TCP: the image's first-start setup server listens on the socket only.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "billing"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - rehearse_pgdata:/var/lib/postgresql/data

  provider-stub:
    image: python:3.12-alpine
    command:
      - python
      - -u
      - -c
      - |
        import json, sys
        from http.server import BaseHTTPRequestHandler, HTTPServer
        FX = json.dumps(
            {"amount": 1.0, "base": "USD", "date": "2026-01-01", "rates": {"IDR": 16250.5}}
        ).encode()
        CF = json.dumps({"success": True, "errors": [], "messages": [], "result": {}}).encode()
        class H(BaseHTTPRequestHandler):
            def _send(self, body):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            def do_GET(self):
                print("stub GET " + self.path.split("?")[0], flush=True)
                self._send(FX)
            def do_PATCH(self):
                n = int(self.headers.get("Content-Length") or 0)
                self.rfile.read(n)
                print("stub CLOUDFLARE PATCH " + self.path, flush=True)
                self._send(CF)
            def log_message(self, *args):
                pass
        HTTPServer(("0.0.0.0", 8080), H).serve_forever()

  wenhao-billing-api:
    environment:
      CLOUDFLARE_API_BASE_URL: http://provider-stub:8080/client/v4
      FX_PROVIDER_BASE_URL: http://provider-stub:8080

  wenhao-billing-api-go:
    environment:
      CLOUDFLARE_API_BASE_URL: http://provider-stub:8080/client/v4
      FX_PROVIDER_BASE_URL: http://provider-stub:8080

  wenhao-billing-web:
    ports:
      - "${REHEARSE_HTTP_PORT:-8080}:80"

volumes:
  rehearse_pgdata:
