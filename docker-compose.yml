services:
  db:
    # PostgreSQL 18 like production. The 18 image keeps PGDATA in
    # /var/lib/postgresql/18/docker and declares its volume at
    # /var/lib/postgresql, so db_data is mounted there (the old .../data mount
    # was for 16). A db_data volume made by 16 must be recreated.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "billing"]
      interval: 5s
      timeout: 3s
      retries: 10


  backend:
    build:
      context: ./backend-python
    environment:
      DATABASE_URL: postgresql+psycopg://billing:billing@db:5432/billing
      SESSION_SECRET: dev-session-secret-change-me
      WEBHOOK_HMAC_SECRET: dev-webhook-secret-change-me
      EMAIL_WEBHOOK_TOKEN: dev-email-token-change-me
      CORS_ORIGINS: '["http://localhost:5173"]'
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_CONFIRM_SECRET: ${MCP_CONFIRM_SECRET:-dev-mcp-confirm-secret-change-me}
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:-dev-mcp-token-secret-change-me}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-http://localhost:8000}
      MCP_ACCESS_TOKEN_TTL_SECONDS: ${MCP_ACCESS_TOKEN_TTL_SECONDS:-3600}
      MCP_REFRESH_TOKEN_TTL_SECONDS: ${MCP_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./backend-python/app:/app/app
      - ./backend-python/alembic:/app/alembic
      - ./backend-python/scripts:/app/scripts
      - ./backend-python/tests:/app/tests
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]


  frontend:
    build:
      context: ./frontend
    environment:
      # Inside the compose network the backend is reachable by service name.
      VITE_API_PROXY_TARGET: http://backend:8000
      # Bind-mounts on Windows/WSL2 often need polling for file watching.
      CHOKIDAR_USEPOLLING: "true"
      VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
      VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      # Named volume for node_modules — keeps the container's install intact
      # and avoids the host overlay clobbering it.
      - frontend_node_modules:/app/node_modules

  # Go toolchain for backend/ (run via backend/dev). Uses this file's network,
  # so no extra Compose project or network is created.
  go:
    profiles: ["tools"]
    image: golang:1.27-bookworm
    working_dir: /src
    volumes:
      - ./backend:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    environment:
      CGO_ENABLED: "1"
      GOFLAGS: -mod=vendor
      PGTESTDB_URL: postgres://billing:billing@db-test:5432/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy

  # Postgres for the Go tests only (PGTESTDB_URL above), never for data that
  # matters. Each test clones its own database from a migrated template and
  # drops it, so durability buys nothing: fsync is off and the data lives in
  # tmpfs (gone when the container stops; the first test run after that
  # rebuilds the template). Created and dropped databases were most of each
  # test's time on the dev `db`. max_connections leaves room for
  # ./dev test's parallel tests, each with its own pool. No published port.
  # The tmpfs is RAM inside the WSL VM, so it is capped: a full run peaks
  # near 700 MB, but pgtestdb keeps a failed test's database for inspection
  # and those pile up until the container stops (2 GB seen). Past the cap
  # Postgres reports "No space left on device"; `docker compose --profile
  # tools restart db-test` clears it.
  # PostgreSQL 18 like production; as for `db`, its data lives under
  # /var/lib/postgresql (PGDATA /var/lib/postgresql/18/docker), all of it tmpfs.
  db-test:
    profiles: ["tools"]
    image: postgres:18-alpine
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    tmpfs:
      - /var/lib/postgresql:size=1536m
    healthcheck:
      # Over TCP: the image's first-start setup server listens on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "billing"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The Go API (backend/) for local comparison with the Python backend on
  # :8000. Not started by `docker compose up`. Run it against a scratch copy of
  # the database, never `billing`: serve migrates, and adopt-baseline rewrites
  # the migration bookkeeping. Set GO_DATABASE_URL to a scratch database for
  # the run. Unset, it points at the nonexistent billing_go_scratch, so a
  # forgotten override fails to connect instead of touching `billing` (a
  # required-variable `:?` would break every compose command, since Compose
  # interpolates the whole file).
  api-go:
    profiles: ["tools"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${GO_DATABASE_URL:-postgresql://billing:billing@db:5432/billing_go_scratch}
      SESSION_SECRET: dev-session-secret-change-me-32-bytes-min
      CORS_ORIGINS: '["http://localhost:5173"]'
      ENVIRONMENT: development
    ports:
      - "${GO_API_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  gomod:
  gobuild:
  frontend_node_modules:
