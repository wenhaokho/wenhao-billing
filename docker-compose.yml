services:
  db:
    # PostgreSQL 18 like production. The 18 image keeps PGDATA in
    # /var/lib/postgresql/18/docker and declares its volume at
    # /var/lib/postgresql, so db_data is mounted there (the old .../data mount
    # was for 16). A db_data volume made by 16 must be recreated.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "billing"]
      interval: 5s
      timeout: 3s
      retries: 10


  # The Go API (backend/), built as production builds it. Serve applies the
  # goose migrations to `billing` first (an Alembic-built dev database is
  # adopted, refusing on schema drift). There is no live reload: after a Go
  # change, `docker compose up -d --build backend`. ENVIRONMENT=development
  # allows the published dev secrets below (and the Go defaults for the
  # intake and MCP secrets) and a non-Secure session cookie; any other value
  # refuses them. The scheduled jobs stay off unless SCHEDULER_ENABLED=true.
  backend:
    build:
      context: ./backend
    environment: &backend-env
      ENVIRONMENT: development
      DATABASE_URL: postgresql://billing:billing@db:5432/billing
      SESSION_SECRET: dev-session-secret-change-me-32-bytes-min
      WEBHOOK_HMAC_SECRET: dev-webhook-secret-change-me
      EMAIL_WEBHOOK_TOKEN: dev-email-token-change-me
      CORS_ORIGINS: '["http://localhost:5173"]'
      APP_BASE_URL: http://localhost:5173
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_CONFIRM_SECRET: ${MCP_CONFIRM_SECRET:-dev-mcp-confirm-secret-change-me}
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:-dev-mcp-token-secret-change-me}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-http://localhost:8000}
      MCP_ACCESS_TOKEN_TTL_SECONDS: ${MCP_ACCESS_TOKEN_TTL_SECONDS:-3600}
      MCP_REFRESH_TOKEN_TTL_SECONDS: ${MCP_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Distroless has no shell or curl: the binary probes its own /health.
      test: ["CMD", "/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s


  frontend:
    build:
      context: ./frontend
    environment:
      # Inside the compose network the backend is reachable by service name.
      VITE_API_PROXY_TARGET: http://backend:8000
      # Bind-mounts on Windows/WSL2 often need polling for file watching.
      CHOKIDAR_USEPOLLING: "true"
      VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
      VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      # Named volume for node_modules — keeps the container's install intact
      # and avoids the host overlay clobbering it.
      - frontend_node_modules:/app/node_modules

  # The Playwright suite's own API and SPA (profile e2e, started by
  # scripts/e2e.sh), so the suite never writes to the dev `billing` database.
  # backend-e2e is the backend above on the `billing_e2e` database, which
  # scripts/e2e.sh drops and recreates before every run (the baseline
  # migration seeds the business profile, chart of accounts and an FX rate);
  # frontend-e2e is the vite dev server proxying to it. No published ports:
  # Playwright reaches them on the stack's network. Scheduler always off.
  backend-e2e:
    profiles: ["e2e"]
    build:
      context: ./backend
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://billing:billing@db:5432/billing_e2e
      SCHEDULER_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  frontend-e2e:
    profiles: ["e2e"]
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend-e2e:8000
    depends_on:
      backend-e2e:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      # Its own install and vite cache, apart from the dev frontend's.
      - frontend_e2e_node_modules:/app/node_modules

  # Go toolchain for backend/ (run via backend/dev). Uses this file's network,
  # so no extra Compose project or network is created.
  go:
    profiles: ["tools"]
    image: golang:1.27-bookworm
    working_dir: /src
    volumes:
      - ./backend:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    environment:
      CGO_ENABLED: "1"
      GOFLAGS: -mod=vendor
      PGTESTDB_URL: postgres://billing:billing@db-test:5432/postgres?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy

  # Postgres for the Go tests only (PGTESTDB_URL above), never for data that
  # matters. Each test clones its own database from a migrated template and
  # drops it, so durability buys nothing: fsync is off and the data lives in
  # tmpfs (gone when the container stops; the first test run after that
  # rebuilds the template). Created and dropped databases were most of each
  # test's time on the dev `db`. max_connections leaves room for
  # ./dev test's parallel tests, each with its own pool. No published port.
  # The tmpfs is RAM inside the WSL VM, so it is capped: a full run peaks
  # near 700 MB, but pgtestdb keeps a failed test's database for inspection
  # and those pile up until the container stops (2 GB seen). Past the cap
  # Postgres reports "No space left on device"; `docker compose --profile
  # tools restart db-test` clears it.
  # PostgreSQL 18 like production; as for `db`, its data lives under
  # /var/lib/postgresql (PGDATA /var/lib/postgresql/18/docker), all of it tmpfs.
  db-test:
    profiles: ["tools"]
    image: postgres:18-alpine
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    tmpfs:
      - /var/lib/postgresql:size=1536m
    healthcheck:
      # Over TCP: the image's first-start setup server listens on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "billing"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db_data:
  gomod:
  gobuild:
  frontend_node_modules:
  frontend_e2e_node_modules:
